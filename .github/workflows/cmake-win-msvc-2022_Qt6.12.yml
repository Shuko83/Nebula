# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on windows10 QT6 msvc2022

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  QT_VERSION: "6.12.*"
  # What the analysis of SonarQube Cloud reads from the build (#147): the compiler commands, recorded by its build
  # wrapper, and the coverage of the tests, measured by OpenCppCoverage in the Cobertura format.
  BUILD_WRAPPER_OUT_DIR: build-wrapper
  COVERAGE_REPORT: coverage.xml
jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
          submodules: recursive
          # The whole history, which SonarQube tells the new code from the rest by.
          fetch-depth: 0

    - name: Setup MSVC developer environment
      uses: ilammy/msvc-dev-cmd@v1

    # Without them, the action would fall back to installing Qt with aqtinstall alone, which fails further on.
    - name: Check the Qt account
      shell: pwsh
      env:
        QT_EMAIL: ${{ secrets.QT_EMAIL }}
        QT_PASSWORD: ${{ secrets.QT_PASSWORD }}
      run: |
        if (-not $env:QT_EMAIL -or -not $env:QT_PASSWORD) {
          Write-Error "Qt is installed with the Qt account of the repository secrets QT_EMAIL and QT_PASSWORD: one is missing"
          exit 1
        }

    # Checked before the build: without it, the analysis of SonarQube Cloud, whose quality gate a pull request has to
    # pass, fails once everything is built.
    - name: Check the token of SonarQube Cloud
      shell: pwsh
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        if (-not $env:SONAR_TOKEN) {
          Write-Error "SonarQube Cloud analyzes the code with the token of the repository secret SONAR_TOKEN: it is missing"
          exit 1
        }

    # OpenCppCoverage runs the tests and measures their coverage. Its installer is downloaded from its GitHub release
    # with the token of the workflow: GitHub can refuse the anonymous download the package of Chocolatey made, as it
    # did under load (#154). That of 0.9.9.0, the latest release, checked by its SHA-256 (the file whose SHA-512 the
    # package of Chocolatey checked). Installed before Qt and the build, which a failure here would otherwise waste.
    - name: Install OpenCppCoverage
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        INSTALLER: OpenCppCoverageSetup-x64-0.9.9.0.exe
        INSTALLER_SHA256: 2295a733da39412c61e4f478677519dd0bb1893d88313ce56b468c9e50517888
      run: |
        gh release download release-0.9.9.0 --repo OpenCppCoverage/OpenCppCoverage --pattern $env:INSTALLER --dir $env:RUNNER_TEMP
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $installer = Join-Path $env:RUNNER_TEMP $env:INSTALLER
        $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
        if ($hash -ne $env:INSTALLER_SHA256) {
          Write-Error "$env:INSTALLER has the SHA-256 $hash, not $env:INSTALLER_SHA256"
          exit 1
        }
        # Inno Setup, run silently, waited for until it ends.
        $setup = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
        if ($setup.ExitCode -ne 0) {
          Write-Error "The installer of OpenCppCoverage ended with the code $($setup.ExitCode)"
          exit 1
        }
        $directory = "C:\Program Files\OpenCppCoverage"
        if (-not (Test-Path "$directory\OpenCppCoverage.exe")) {
          Write-Error "The installer of OpenCppCoverage did not put OpenCppCoverage.exe in $directory"
          exit 1
        }
        $directory >> $env:GITHUB_PATH

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        cache: true
        # aqtinstall 3.3.0, the latest release, which the action installs Qt with, does not find Qt 6.11 and later in
        # the repository of Qt, laid out by architecture since then. It runs the official online installer of Qt
        # instead, with the Qt account of the repository secrets. Back to the default once an aqtinstall release
        # finds them (miurahr/aqtinstall#1000).
        use-official: true
        email: ${{ secrets.QT_EMAIL }}
        pw: ${{ secrets.QT_PASSWORD }}
          
    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      # install-qt-action has put the Qt it installed in CMAKE_PREFIX_PATH.
      # Release, with the debug information OpenCppCoverage reads the lines of the code from: /Zi, and /DEBUG with the
      # optimizations of the linker it would turn off otherwise.
      run: >
        cmake -S . -B ${{github.workspace}}/build
        -DCMAKE_CXX_FLAGS_RELEASE="/O2 /Ob2 /DNDEBUG /Zi"
        -DCMAKE_EXE_LINKER_FLAGS_RELEASE="/DEBUG /INCREMENTAL:NO /OPT:REF /OPT:ICF"
        -DCMAKE_SHARED_LINKER_FLAGS_RELEASE="/DEBUG /INCREMENTAL:NO /OPT:REF /OPT:ICF"
        -DCMAKE_MODULE_LINKER_FLAGS_RELEASE="/DEBUG /INCREMENTAL:NO /OPT:REF /OPT:ICF"

    - name: Install the build wrapper of SonarQube
      uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v7

    - name: Build
      # Under the build wrapper, which records the compiler commands for the analysis.
      run: >
        build-wrapper-win-x86-64.exe --out-dir ${{env.BUILD_WRAPPER_OUT_DIR}}
        cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      # The QTest executables of tests/, see docs/testing.md: a failing test fails the pull request.
      # Run by OpenCppCoverage, which returns their exit code, and measures what they cover of the code of the
      # repository built in build/, the code of the tests, of CMakeUtils and what CMake generates left out. It writes
      # the report here, ctest runs in build/. Its arguments in an array, which PowerShell passes as they are, --
      # included.
      shell: pwsh
      run: |
        $repository = "${{github.workspace}}"
        $arguments = @(
          '--quiet', '--cover_children',
          '--modules', "$repository\build",
          '--sources', $repository,
          '--excluded_sources', "$repository\build",
          '--excluded_sources', "$repository\tests",
          '--excluded_sources', "$repository\CMakeUtils",
          '--export_type', "cobertura:$env:COVERAGE_REPORT",
          '--working_dir', "$repository\build",
          '--', (Get-Command ctest).Source, '-C', $env:BUILD_TYPE, '--output-on-failure'
        )
        OpenCppCoverage.exe @arguments

    # What SonarQube counts the new code of the main branch from: the version of project().
    - name: Read the version of the project
      shell: pwsh
      run: |
        $match = Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_PROJECT_VERSION:[A-Z]+=(.+)$'
        "PROJECT_VERSION=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_ENV

    - name: Analyze on SonarQube Cloud
      # What is analyzed is in sonar-project.properties. The step waits for the quality gate of the project, and fails
      # the pull request when the code it adds does not pass it: Sonar way, which asks of the new code the rating A in
      # security, reliability and maintainability, 80 % of it covered by the tests, 3 % of it duplicated at most, and
      # each of its security hotspots reviewed.
      uses: SonarSource/sonarqube-scan-action@v7
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          --define sonar.cfamily.compile-commands=${{env.BUILD_WRAPPER_OUT_DIR}}/compile_commands.json
          --define sonar.cfamily.cobertura.reportPaths=${{env.COVERAGE_REPORT}}
          --define sonar.projectVersion=${{env.PROJECT_VERSION}}
          --define sonar.qualitygate.wait=true
