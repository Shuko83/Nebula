# Builds Nebula in Release and publishes the GitHub release of a version tag, the three numbers of the version alone
# (0.2.0): its package as a zip, and the installer of NebulaStudio (#140), with the notes of
# docs/release-notes/<tag>.md. On a pull request that changes this file, nothing is published: the zip and the
# installer are an artifact of the run.
name: Release

on:
  push:
    tags: [ "[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "main" ]
    paths: [ ".github/workflows/release.yml" ]
  # Builds and publishes an existing tag again, with this file as it is on the branch the run is started from:
  # the way out when the file of the tag itself is the one that failed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. 0.2.0"
        required: true

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.12.*"
  # Empty on a pull request.
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        # Empty unless the run was started by hand: the commit of the event.
        ref: ${{ inputs.tag }}
        submodules: recursive

    - name: Setup MSVC developer environment
      uses: ilammy/msvc-dev-cmd@v1

    # As in cmake-win-msvc-2022_Qt6.12.yml: Qt is installed by its official installer, with a Qt account.
    - name: Check the Qt account
      shell: pwsh
      env:
        QT_EMAIL: ${{ secrets.QT_EMAIL }}
        QT_PASSWORD: ${{ secrets.QT_PASSWORD }}
      run: |
        if (-not $env:QT_EMAIL -or -not $env:QT_PASSWORD) {
          Write-Error "Qt is installed with the Qt account of the repository secrets QT_EMAIL and QT_PASSWORD: one is missing"
          exit 1
        }

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        cache: true
        use-official: true
        email: ${{ secrets.QT_EMAIL }}
        pw: ${{ secrets.QT_PASSWORD }}

    - name: Configure CMake
      run: cmake -S . -B ${{ github.workspace }}/build

    - name: Read the version and the package of the project
      shell: pwsh
      run: |
        function Read-Cache($entry) {
          $match = Select-String -Path build/CMakeCache.txt -Pattern "^${entry}:[A-Z]+=(.+)$"
          return $match.Matches[0].Groups[1].Value
        }
        $version = Read-Cache 'CMAKE_PROJECT_VERSION'
        # A tag that is not the version would publish binaries and a package that tell another one.
        if ($env:TAG -and $version -ne $env:TAG) {
          Write-Error "The tag $env:TAG is not the version of the project: project(Nebula VERSION $version)"
          exit 1
        }
        # Named by CMake from what the binaries are built for and with (#139): Nebula_2.2.0_win-x64_msvc2022_Qt6.12.
        "PACKAGE=$(Read-Cache 'NEBULA_PACKAGE_NAME')" >> $env:GITHUB_ENV
        # And the installer of NebulaStudio, made from it (#140): NebulaStudio_2.2.0_win-x64_msvc2022_Qt6.12_setup.
        "INSTALLER=$(Read-Cache 'NEBULA_INSTALLER_NAME')" >> $env:GITHUB_ENV
        # The cpack of the CMake that configured the build: in PATH, cpack can be the one of Chocolatey.
        "CPACK=$(Read-Cache 'CMAKE_CPACK_COMMAND')" >> $env:GITHUB_ENV

    - name: Build
      # Several projects at once, each compiling its files in parallel, as in cmake-win-msvc-2022_Qt6.12.yml.
      run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Install the package
      shell: pwsh
      run: |
        $prefix = "${{ github.workspace }}/dist/$env:PACKAGE"
        cmake --install build --config $env:BUILD_TYPE --prefix $prefix
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # Not installed by the build: the licenses the files of the package are under, and how to use them.
        Copy-Item LICENSE, README.md -Destination $prefix
        Copy-Item CMakeUtils/LICENSE -Destination "$prefix/Core/cmake/CMakeUtils"
        # The font of its titles is in NebulaStudio.exe, and in StudioPlugin.nbdl, in plugins/ next to each
        # application: its license goes with them.
        foreach ($application in 'NebulaStudio', 'ExampleApp', 'ExampleUniverseApp') {
          Copy-Item NebulaStudio/resources/fonts/OFL.txt -Destination "$prefix/$application/SpaceGrotesk-OFL.txt"
        }
        # The galaxy of NebulaStudio, in scene/ next to the applications that list it and run it.
        foreach ($application in 'NebulaStudio', 'ExampleUniverseApp') {
          $scene = "$prefix/$application/$env:BUILD_TYPE/bin/scene"
          New-Item -ItemType Directory -Force -Path $scene | Out-Null
          Copy-Item StudioPlugin/NebulaStudio.nbp -Destination $scene
        }

    - name: Zip the package
      working-directory: dist
      run: cmake -E tar cf "${{ env.PACKAGE }}.zip" --format=zip "${{ env.PACKAGE }}"

    # Inno Setup is installed on the runner, in C:\Program Files (x86)\Inno Setup 6, where CPack finds it: nothing to
    # download. CPack installs the component NebulaStudio of the build in build/installer, then compiles the installer.
    - name: Build the installer of NebulaStudio
      shell: pwsh
      run: |
        & $env:CPACK --config build/CPackConfig.cmake -C $env:BUILD_TYPE -B build/installer
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Copy-Item "build/installer/$env:INSTALLER.exe" -Destination dist

    # As a user runs it: installed, NebulaStudio started from it and closed, then uninstalled.
    - name: Check the installer
      shell: pwsh
      run: ./tests/Package/TestInstaller.ps1 -Installer "dist/$env:INSTALLER.exe" -Folder "$env:RUNNER_TEMP/NebulaStudio"

    - name: Upload the package and the installer (pull request)
      if: env.TAG == ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGE }}
        path: |
          dist/${{ env.PACKAGE }}.zip
          dist/${{ env.INSTALLER }}.exe

    - name: Publish the release
      if: env.TAG != ''
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $files = "dist/$($env:PACKAGE).zip", "dist/$($env:INSTALLER).exe"
        gh release view $env:TAG *> $null
        if ($LASTEXITCODE -eq 0) {
          # Published already, by hand or by an earlier run: only its package and its installer are replaced.
          gh release upload $env:TAG @files --clobber
        } else {
          $notes = "docs/release-notes/$($env:TAG).md"
          if (Test-Path $notes) { $notesArguments = '--notes-file', $notes } else { $notesArguments = '--generate-notes' }
          gh release create $env:TAG @files --verify-tag --title "Nebula $env:TAG" @notesArguments
        }
